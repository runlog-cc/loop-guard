name: Offline checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned test-only SDK dependencies
        run: python -m pip install -r packages/python/tests/requirements-sdk.txt
      - name: Check the real SDKs through controlled local transports
        env:
          PYTHONPATH: packages/python
        run: |
          python -m pytest packages/python/tests
          python examples/fake_provider.py
  node-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.2'
      - name: Install locked test dependencies and build/check the SDK
        run: |
          npm --prefix packages/typescript ci --ignore-scripts
          npm --prefix packages/typescript run test:node
